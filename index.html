<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hezron - Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#07071a;color:#fff;padding:15px}
a{color:#fff;text-decoration:none}
span{color:#c026d3}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 25px}
.logo{font-size:28px;font-weight:900;font-style:italic;color:#60a5fa}
.logo b{color:#c026d3}
.nav-links a{margin-left:18px;font-size:13px;opacity:.9}
.nav-links a:hover{color:#c026d3}
.card{background:linear-gradient(135deg,#1e1b4b,#3b0764,#0f0f2e);border:1px solid #4c1d95;border-radius:22px;padding:28px;margin-bottom:15px;overflow:hidden}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero h1{font-size:48px;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:14px 0 20px;color:#d1d5db}
.btn{background:#7c3aed;padding:11px 22px;border-radius:25px;border:none;color:#fff;cursor:pointer;font-weight:600}
.hero-img img{width:260px;height:310px;object-fit:cover;border-radius:18px;border:2px solid #7c3aed}
h2{font-size:26px;margin-bottom:18px}
.about{display:flex;justify-content:space-between;gap:20px;align-items:center}
.about p{color:#d1d5db;line-height:1.6;max-width:60%}
.about img{width:200px;height:130px;object-fit:cover;border-radius:12px}
.skills{display:flex;gap:14px}
.skill{flex:1;background:#151536;border:1px solid #33335c;border-radius:14px;padding:20px;text-align:center}
.skill img{width:52px;height:52px}
.skill p{margin-top:10px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center}
.projects{display:flex;gap:14px;margin-top:10px}
.projects img{flex:1;width:100%;height:150px;object-fit:cover;border-radius:14px}
.contact-row{display:flex;justify-content:space-between;align-items:center}
.socials{font-size:22px;display:flex;gap:18px}
.socials a{background:#22224a;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%}
@media(max-width:700px){.hero,.about,.projects,.skills{flex-direction:column}.hero-img img{width:100%}.about p{max-width:100%}}
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">HEZRON<b>.</b></div>
  <nav class="nav-links">
    <a href="#home">Home</a><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
  </nav>
</header>

<section id="home" class="card hero">
  <div>
    <h1>Hi, I'm<br><span>Hezron</span></h1>
    <p>Developer<br>Building modern web solutions.</p>
    <button class="btn" onclick="document.getElementById('projects').scrollIntoView({behavior:'smooth'})">View My Work →</button>
  </div>
  <div class="hero-img">
    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80" alt="Hezron Profile">
  </div>
</section>

<section id="about" class="card">
  <h2>About <span>Me</span></h2>
  <div class="about">
    <p>I'm Hezron, a passionate developer who loves creating innovative and user-friendly web applications.</p>
    <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=600&q=80" alt="Coding">
  </div>
</section>

<section id="skills" class="card">
  <h2>My <span>Skills</span></h2>
  <div class="skills">
    <div class="skill"><img src="https://cdn-icons-png.flaticon.com/512/732/732212.png"><p>HTML</p></div>
    <div class="skill"><img src="https://cdn-icons-png.flaticon.com/512/732/732190.png"><p>CSS</p></div>
    <div class="skill"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png"><p>JavaScript</p></div>
  </div>
</section>

<section id="projects" class="card">
